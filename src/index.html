<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Kuark Studio</title>
        <style>
        html, body, #editor {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            overflow: hidden;
        }

        #app {
            position: absolute;
            z-index: 100;
            right: 0;
            bottom: 0;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #app > * {
            pointer-events: auto; /* children regain clickability */
        }


        
        #editor {
            position: relative;
            /*top: -100%;*/
        }
        </style>

        <link rel="stylesheet" href="../dist/assets/main.css" />
        <link rel="stylesheet" href="../dist/assets/layouts.css" />
        <link rel="stylesheet" href="../dist/assets/aesthetics.css" />
    </head>
    <body>
        <div id="app"></div>
        <div id="editor"></div>
        <script type="module" src="../dist/assets/main.js"></script>
    </body>
</html>
